name: Update Homebrew package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homebrew-cask
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'murlexander/louppe-media-culler'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the distribution branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Verify the latest stable ZIP and update the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/update_homebrew_cask.py

      - name: Publish the updated package definition
        run: |
          if git diff --quiet -- Casks/louppe.rb; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/louppe.rb
          git commit -m "Update Homebrew cask for latest Louppe release"
          git push origin HEAD:main
